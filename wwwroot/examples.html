<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Code Examples - API Playground</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="theme.css">
  <script src="theme.js"></script>
  <link rel="stylesheet" href="css/playground-sidebar.css">
  <link rel="stylesheet" href="css/playground-animations.css">
  <link rel="stylesheet" href="css/playground-v6.css">
  <link rel="stylesheet" href="css/playground-dark.css">
  <link rel="stylesheet" href="css/playground-examples.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
</head>
<body class="pg-app pg-examples-page bg-gradient-to-br from-gray-50 via-neutral-100 to-neutral-50 flex flex-col" style="height:100vh;margin:0;overflow:hidden;">
  <nav class="bg-white shadow-md h-12 flex items-center justify-between px-6 sticky top-0 z-40">
    <a href="apikey.html" class="pg-brand flex items-center gap-2.5 flex-shrink-0 min-w-0 no-underline">
      <img src="ezofis-logo.png?v=20260721" alt="EZOFIS" class="pg-brand-logo" width="36" height="36">
      
      <h1 class="pg-brand-title">API Playground</h1>
    </a>
    <div class="flex space-x-4 text-sm">
      <a href="examples.html" class="px-3 py-1 rounded text-white bg-gradient-to-r from-neutral-800 to-neutral-900">Code Examples</a>
      <a href="playground-documentation.html" class="px-3 py-1 rounded text-gray-700 hover:bg-gray-100">Developer Docs</a>
      <a href="my-api-keys.html" class="px-3 py-1 rounded text-gray-700 hover:bg-gray-100">My API Keys</a>
      <a href="usage-report.html" class="px-3 py-1 rounded text-gray-700 hover:bg-gray-100">API Usage</a>
    </div>
  </nav>
  <div class="flex flex-1 overflow-hidden">
    <aside id="sidebar"></aside>
    <script src="js/playground-base.js"></script>
    <script src="js/playground-sidebar.js"></script><script>PlaygroundSidebar.mount('/examples.html');</script>
    <main class="flex-1 overflow-y-auto p-4 pb-8">
      <div class="max-w-7xl mx-auto">
        <div class="text-center mb-4 animate-fadeInUp">
          <h2 class="text-xl font-semibold text-gray-900">Code Examples</h2>
          <p class="text-xs text-gray-600">Pick a wrapper function and copy a ready-to-use sample request.</p>
        </div>
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
          <div class="bg-white rounded-lg shadow-md p-4 card-hover animate-slideInLeft delay-100">
            <h3 class="text-base font-semibold mb-3">Configuration</h3>
            <div class="space-y-3">
              <div>
                <label class="block text-xs font-semibold mb-1">Function Type</label>
                <select id="functionType" class="w-full border rounded px-3 py-2 text-sm">
                  <option value="apikey">Generate API Key</option>
                  <option value="workflows">Workflow List</option>
                  <option value="start">Initiate Request</option>
                  <option value="moveNext">Move Transaction</option>
                  <option value="uploadFile">Upload File To Repository</option>
                  <option value="downloadFile">Download File From Repository</option>
                  <option value="repoFilter">Repository Filter</option>
                </select>
              </div>
              <div>
                <label class="block text-xs font-semibold mb-1">API Key</label>
                <input id="apiKey" class="w-full border rounded px-3 py-2 text-sm font-mono" placeholder="your-api-key">
              </div>
              <div id="workflowNameWrap" class="hidden">
                <label class="block text-xs font-semibold mb-1">Workflow name</label>
                <input id="workflowName" class="w-full border rounded px-3 py-2 text-sm" value="My Ticket Workflow">
              </div>
              <div id="repositoryNameWrap" class="hidden">
                <label class="block text-xs font-semibold mb-1">Repository name</label>
                <input id="repositoryName" class="w-full border rounded px-3 py-2 text-sm" value="Invoice Repository">
              </div>
              <div id="instanceIdWrap" class="hidden">
                <label class="block text-xs font-semibold mb-1">Instance ID</label>
                <input id="instanceId" class="w-full border rounded px-3 py-2 text-sm font-mono" value="00000000-0000-0000-0000-000000000000">
              </div>
              <div id="itemIdWrap" class="hidden">
                <label class="block text-xs font-semibold mb-1">Item ID</label>
                <input id="itemId" class="w-full border rounded px-3 py-2 text-sm font-mono" value="00000000-0000-0000-0000-000000000000">
              </div>
            </div>
          </div>
          <div class="lg:col-span-2 bg-white rounded-lg shadow-md p-4 pg-examples-code card-hover animate-slideInRight delay-200">
            <div class="flex items-center justify-between mb-3">
              <h3 class="text-base font-semibold">Sample request</h3>
              <div class="flex gap-2 text-xs">
                <button id="tabJs" type="button" class="px-3 py-1 rounded bg-neutral-800 text-white font-semibold ring-2 ring-neutral-800 ring-offset-1">JavaScript</button>
                <button id="tabCurl" type="button" class="px-3 py-1 rounded border text-gray-600">cURL</button>
                <button id="tabPython" type="button" class="px-3 py-1 rounded border text-gray-600">Python</button>
                <button id="copyBtn" type="button" class="px-3 py-1 rounded border text-gray-600">Copy</button>
              </div>
            </div>
            <pre id="codeBlock" class="pg-sample-code bg-gray-50 border rounded p-3 text-xs overflow-auto min-h-[420px]"><code id="codeInner" class="language-bash"></code></pre>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/bash.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/javascript.min.js"></script>
  <script>
    const state = { lang: 'javascript', raw: '' };
    const block = document.getElementById('codeBlock');
    const codeInner = document.getElementById('codeInner');
    const tabs = {
      javascript: document.getElementById('tabJs'),
      curl: document.getElementById('tabCurl'),
      python: document.getElementById('tabPython')
    };
    function activeTab() {
      Object.keys(tabs).forEach(k => {
        const on = state.lang === k;
        tabs[k].className = on
          ? 'px-3 py-1 rounded bg-neutral-800 text-white font-semibold ring-2 ring-neutral-800 ring-offset-1'
          : 'px-3 py-1 rounded border text-gray-600 hover:bg-gray-50';
        tabs[k].setAttribute('aria-pressed', on ? 'true' : 'false');
      });
    }
    function highlightLang() {
      if (state.lang === 'python') return 'python';
      if (state.lang === 'javascript') return 'javascript';
      return 'bash';
    }
    function highlightCode(source) {
      state.raw = source;
      const lang = highlightLang();
      codeInner.className = 'language-' + lang;
      if (window.hljs) {
        codeInner.innerHTML = hljs.highlight(source, { language: lang, ignoreIllegals: true }).value;
        block.classList.add('hljs');
      } else {
        codeInner.textContent = source;
      }
    }
    function buildCode() {
      const fn = document.getElementById('functionType').value;
      const apiKey = document.getElementById('apiKey').value || 'your-api-key';
      const workflowName = document.getElementById('workflowName').value || 'My Ticket Workflow';
      const repositoryName = document.getElementById('repositoryName').value || 'Invoice Repository';
      const instanceId = document.getElementById('instanceId').value || 'instance-guid';
      const itemId = document.getElementById('itemId').value || 'item-guid';
      const repositoryId = '00000000-0000-0000-0000-000000000000';
      const base = (window.PlaygroundBase && PlaygroundBase.base) ? (window.location.origin + PlaygroundBase.base) : window.location.origin;
      document.getElementById('workflowNameWrap').classList.toggle('hidden', !(fn === 'start' || fn === 'moveNext'));
      document.getElementById('repositoryNameWrap').classList.toggle('hidden', fn !== 'uploadFile' && fn !== 'repoFilter');
      document.getElementById('instanceIdWrap').classList.toggle('hidden', fn !== 'moveNext');
      document.getElementById('itemIdWrap').classList.toggle('hidden', fn !== 'downloadFile');
      const curlMap = {
        apikey: `curl -X POST "${base}/api/Client/apiKey?userName=user@example.com&password=YourPassword"`,
        workflows: `curl -X GET "${base}/api/v6/workflows" \\\n  -H "X-API-Key: ${apiKey}"`,
        start: `curl -X POST "${base}/api/v6/workflows/start" \\\n  -H "X-API-Key: ${apiKey}" \\\n  -F "workflowName=${workflowName}" \\\n  -F "file=@Archive_Sample.pdf;type=application/pdf" \\\n  -F "context=string" \\\n  -F "envType=string"`,
        moveNext: `curl -X POST "${base}/api/v6/workflows/instances/${instanceId}/move-next" \\\n  -H "X-API-Key: ${apiKey}" \\\n  -H "Content-Type: application/json" \\\n  -d '{\n  "workflowName": "${workflowName}",\n  "activityid": "YOUR_ACTIVITY_ID",\n  "review": "approve",\n  "comments": "Approved via playground"\n}'`,
        uploadFile: `curl -X POST "${base}/api/v6/repositories/upload-file" \\\n  -H "X-API-Key: ${apiKey}" \\\n  -F "repositoryName=${repositoryName}" \\\n  -F "file=@invoice.pdf;type=application/pdf" \\\n  -F "ocrType=ADVANCED" \\\n  -F "pageNo=1"`,
        downloadFile: `curl -X GET "${base}/api/v6/repositories/${repositoryId}/items/${itemId}/file?disposition=attachment" \\\n  -H "X-API-Key: ${apiKey}" \\\n  -o invoice.pdf`,
        repoFilter: `curl -X GET "${base}/api/v6/repositories/${repositoryId}/items/filter-fields" -H "X-API-Key: ${apiKey}"\n\ncurl -X GET "${base}/api/v6/repositories/${repositoryId}/items/facets/Supplier?limit=100" -H "X-API-Key: ${apiKey}"\n\ncurl -X POST "${base}/api/v6/repositories/${repositoryId}/items/query" \\\n  -H "X-API-Key: ${apiKey}" -H "Content-Type: application/json" \\\n  -d '{"filters":{"Supplier":["ACME"]},"page":1,"pageSize":50}'`
      };
      const pyMap = {
        apikey: `import requests\n\nresp = requests.post(\n    "${base}/api/Client/apiKey",\n    params={"userName": "user@example.com", "password": "YourPassword"}\n)\nprint(resp.json())`,
        workflows: `import requests\n\nresp = requests.get(\n    "${base}/api/v6/workflows",\n    headers={"X-API-Key": "${apiKey}"}\n)\nprint(resp.json())`,
        start: `import requests\n\nfiles = {"file": open("Archive_Sample.pdf", "rb")}\ndata = {"workflowName": "${workflowName}", "context": "string", "envType": "string"}\nresp = requests.post(\n    "${base}/api/v6/workflows/start",\n    headers={"X-API-Key": "${apiKey}"},\n    files=files,\n    data=data\n)\nprint(resp.json())`,
        moveNext: `import requests\n\npayload = {"workflowName": "${workflowName}", "activityid": "YOUR_ACTIVITY_ID", "review": "approve", "comments": "Approved via playground"}\nresp = requests.post(\n    "${base}/api/v6/workflows/instances/${instanceId}/move-next",\n    headers={"X-API-Key": "${apiKey}", "Content-Type": "application/json"},\n    json=payload\n)\nprint(resp.json())`,
        uploadFile: `import requests\n\nfiles = {"file": open("invoice.pdf", "rb")}\ndata = {"repositoryName": "${repositoryName}", "ocrType": "ADVANCED", "pageNo": "1"}\nresp = requests.post(\n    "${base}/api/v6/repositories/upload-file",\n    headers={"X-API-Key": "${apiKey}"},\n    files=files,\n    data=data\n)\nprint(resp.json())`,
        downloadFile: `import requests\n\nresp = requests.get(\n    "${base}/api/v6/repositories/${repositoryId}/items/${itemId}/file",\n    params={"disposition": "attachment"},\n    headers={"X-API-Key": "${apiKey}"}\n)\nopen("invoice.pdf", "wb").write(resp.content)`,
        repoFilter: `import requests\nheaders = {"X-API-Key": "${apiKey}"}\nprint(requests.get("${base}/api/v6/repositories/${repositoryId}/items/filter-fields", headers=headers).json())\nprint(requests.get("${base}/api/v6/repositories/${repositoryId}/items/facets/Supplier", headers=headers).json())\nprint(requests.post("${base}/api/v6/repositories/${repositoryId}/items/query", headers={**headers, "Content-Type": "application/json"}, json={"filters": {"Supplier": ["ACME"]}, "page": 1, "pageSize": 50}).json())`
      };
      const jsMap = {
        apikey: `const url = new URL("${base}/api/Client/apiKey");\nurl.searchParams.set("userName", "user@example.com");\nurl.searchParams.set("password", "YourPassword");\n\nconst resp = await fetch(url, { method: "POST" });\nconsole.log(await resp.json());`,
        workflows: `const resp = await fetch("${base}/api/v6/workflows", {\n  method: "GET",\n  headers: { "X-API-Key": "${apiKey}" }\n});\nconsole.log(await resp.json());`,
        start: `const form = new FormData();\nform.append("workflowName", "${workflowName}");\nform.append("file", fileInput.files[0]); // <input type="file">\nform.append("context", "string");\nform.append("envType", "string");\n\nconst resp = await fetch("${base}/api/v6/workflows/start", {\n  method: "POST",\n  headers: { "X-API-Key": "${apiKey}" },\n  body: form\n});\nconsole.log(await resp.json());`,
        moveNext: `const resp = await fetch("${base}/api/v6/workflows/instances/${instanceId}/move-next", {\n  method: "POST",\n  headers: {\n    "X-API-Key": "${apiKey}",\n    "Content-Type": "application/json"\n  },\n  body: JSON.stringify({\n    workflowName: "${workflowName}",\n    activityid: "YOUR_ACTIVITY_ID",\n    review: "approve",\n    comments: "Approved via playground"\n  })\n});\nconsole.log(await resp.json());`,
        uploadFile: `const form = new FormData();\nform.append("repositoryName", "${repositoryName}");\nform.append("file", fileInput.files[0]); // <input type="file">\nform.append("ocrType", "ADVANCED");\nform.append("pageNo", "1");\n\nconst resp = await fetch("${base}/api/v6/repositories/upload-file", {\n  method: "POST",\n  headers: { "X-API-Key": "${apiKey}" },\n  body: form\n});\nconsole.log(await resp.json());`,
        downloadFile: `const resp = await fetch("${base}/api/v6/repositories/${repositoryId}/items/${itemId}/file?disposition=attachment", {\n  headers: { "X-API-Key": "${apiKey}" }\n});\nconst blob = await resp.blob();\nconst url = URL.createObjectURL(blob);\nconst a = document.createElement("a");\na.href = url;\na.download = "invoice.pdf";\na.click();`,
        repoFilter: `const headers = { "X-API-Key": "${apiKey}" };\nconst filters = await (await fetch("${base}/api/v6/repositories/${repositoryId}/items/filter-fields", { headers })).json();\nconst values = await (await fetch("${base}/api/v6/repositories/${repositoryId}/items/facets/Supplier", { headers })).json();\nconst files = await (await fetch("${base}/api/v6/repositories/${repositoryId}/items/query", {\n  method: "POST",\n  headers: { ...headers, "Content-Type": "application/json" },\n  body: JSON.stringify({ filters: { Supplier: ["ACME"] }, page: 1, pageSize: 50 })\n})).json();\nconsole.log(filters, values, files);`
      };
      const map = state.lang === 'python' ? pyMap : state.lang === 'javascript' ? jsMap : curlMap;
      highlightCode(map[fn]);
      activeTab();
    }
    document.getElementById('functionType').onchange = buildCode;
    document.getElementById('apiKey').oninput = buildCode;
    document.getElementById('workflowName').oninput = buildCode;
    document.getElementById('repositoryName').oninput = buildCode;
    document.getElementById('instanceId').oninput = buildCode;
    document.getElementById('itemId').oninput = buildCode;
    document.getElementById('tabCurl').onclick = () => { state.lang = 'curl'; buildCode(); };
    document.getElementById('tabPython').onclick = () => { state.lang = 'python'; buildCode(); };
    document.getElementById('tabJs').onclick = () => { state.lang = 'javascript'; buildCode(); };
    document.getElementById('copyBtn').onclick = async () => {
      const btn = document.getElementById('copyBtn');
      await navigator.clipboard.writeText(state.raw || codeInner.textContent);
      btn.textContent = 'Copied!';
      btn.className = 'px-3 py-1 rounded bg-neutral-800 text-white font-semibold';
      setTimeout(() => {
        btn.textContent = 'Copy';
        btn.className = 'px-3 py-1 rounded border text-gray-600 hover:bg-gray-50';
      }, 1200);
    };
    buildCode();
  </script>
</body>
</html>
