<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inbox View - API Playground</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="theme.css">
    <script src="theme.js"></script>
    <link rel="stylesheet" href="css/playground-sidebar.css">
    <link rel="stylesheet" href="css/playground-animations.css">
    <link rel="stylesheet" href="css/playground-v6.css">
    <link rel="stylesheet" href="css/playground-dark.css">
    <script src="js/playground-base.js"></script>
    <script src="js/playground-shell.js" defer></script>
</head>
<body class="pg-app bg-gradient-to-br from-gray-50 via-blue-50 to-purple-50 flex flex-col" style="height:100vh;margin:0;overflow:hidden;">
    <nav class="bg-white shadow-md h-12 flex items-center justify-between px-6 sticky top-0 z-40">
        <a href="apikey.html" class="pg-brand flex items-center gap-2.5 flex-shrink-0 min-w-0 no-underline">
            <img src="ezofis-logo.png?v=20260716" alt="EZOFIS" class="pg-brand-logo" width="36" height="36">
            
            <h1 class="pg-brand-title">API Playground</h1>
        </a>
        <div class="flex space-x-4 text-sm">
            <a href="examples.html" class="px-3 py-1 rounded font-semibold text-gray-700 hover:bg-gray-100">Code Examples</a>
            <a href="playground-documentation.html" class="px-3 py-1 rounded font-semibold text-gray-700 hover:bg-gray-100">Developer Docs</a>
            <a href="my-api-keys.html" class="px-3 py-1 rounded font-semibold text-gray-700 hover:bg-gray-100">My API Keys</a>
            <a href="usage-report.html" class="px-3 py-1 rounded font-semibold text-gray-700 hover:bg-gray-100">API Usage</a>
        </div>
    </nav>

    <div id="toast" class="hidden fixed top-14 right-4 z-50 bg-white shadow-lg rounded-lg p-3 border-l-4 border-cyan-500 max-w-md">
        <p id="toastMessage" class="text-sm font-medium text-cyan-900"></p>
    </div>

    <div class="flex flex-1 overflow-hidden">
        <aside id="sidebar"></aside>
        <script src="js/playground-sidebar.js"></script>
        <script>PlaygroundSidebar.mount('/inbox.html');</script>
        <main class="flex-1 overflow-y-auto p-4">
            <div class="max-w-6xl mx-auto">
                <div class="text-center mb-4 py-1">
                    <h2 class="text-xl font-semibold text-gray-900">Inbox View</h2>
                    <p class="text-xs text-gray-600 mt-1">Call <code class="bg-gray-100 px-1 rounded">GET /api/v6/workflows/inbox</code> with your playground <code class="bg-gray-100 px-1 rounded">X-API-Key</code></p>
                </div>
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
                    <div class="bg-white rounded-lg shadow-md p-4 space-y-3">
                        <h3 class="text-base font-semibold text-gray-900">Request</h3>
                        <div>
                            <label class="block text-xs font-semibold text-gray-700 mb-1">Playground API key <span class="text-red-500">*</span></label>
                            <input type="text" id="apiKey" class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm font-mono" placeholder="X-API-Key value" autocomplete="off">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-700 mb-1">Workflow ID <span class="text-red-500">*</span></label>
                            <input type="text" id="workflowId" class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm font-mono" placeholder="Workflow GUID">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-700 mb-1">Instance ID</label>
                            <input type="text" id="instanceId" class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm font-mono" placeholder="Optional">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-700 mb-1">Transaction ID</label>
                            <input type="text" id="transactionId" class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm" placeholder="Optional">
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-xs font-semibold text-gray-700 mb-1">Page</label>
                                <input type="number" id="pageNumber" value="1" class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-700 mb-1">Page size</label>
                                <input type="number" id="pageSize" value="20" class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm">
                            </div>
                        </div>
                        <label class="flex items-center gap-2 text-sm text-gray-700"><input id="skipTotal" type="checkbox" class="rounded"> skipTotal</label>
                        <button type="button" id="submitBtn" class="w-full py-2 rounded-md text-white text-sm font-medium pg-btn-primary flex items-center justify-center gap-2">
                            <span id="btnLabel">Load Inbox</span>
                            <svg id="spinner" class="hidden h-4 w-4 animate-spin" viewBox="0 0 24 24" fill="none"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
                        </button>
                        <div id="errBox" class="hidden text-xs text-red-700 bg-red-50 border border-red-200 rounded-md p-2.5"></div>
                    </div>
                    <div class="bg-white rounded-lg shadow-md p-4">
                        <h3 class="text-base font-semibold text-gray-900 mb-2">Response</h3>
                        <div id="emptyHint" class="text-gray-500 text-xs text-center py-10">Submit to see inbox items.</div>
                        <pre id="response" class="hidden bg-gray-50 border rounded p-3 text-xs overflow-auto max-h-[75vh]"></pre>
                        <div id="postOutputActions" class="hidden mt-3 flex flex-wrap gap-2 justify-end">
                            <a href="examples.html" class="text-xs px-3 py-1.5 rounded-md font-medium text-white bg-purple-600 hover:bg-purple-700">Code examples</a>
                            <a href="playground-documentation.html" class="text-xs px-3 py-1.5 rounded-md font-medium text-gray-700 bg-white border border-gray-300 hover:bg-gray-50">Docs</a>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="js/playground-common.js"></script>
    <script>
        const PC = window.PlaygroundCommon;
        PC.restoreFields();
        document.getElementById('submitBtn').onclick = async () => {
            const err = document.getElementById('errBox');
            err.classList.add('hidden');
            const workflowId = document.getElementById('workflowId').value.trim();
            if (!workflowId) { err.textContent = 'Workflow ID is required.'; err.classList.remove('hidden'); return; }
            document.getElementById('btnLabel').textContent = 'Loading...';
            document.getElementById('spinner').classList.remove('hidden');
            try {
                const qs = new URLSearchParams({
                    workflowId,
                    pageNumber: document.getElementById('pageNumber').value || '1',
                    pageSize: document.getElementById('pageSize').value || '20'
                });
                const instanceId = document.getElementById('instanceId').value.trim();
                const transactionId = document.getElementById('transactionId').value.trim();
                if (instanceId) qs.set('instanceId', instanceId);
                if (transactionId) qs.set('transactionId', transactionId);
                if (document.getElementById('skipTotal').checked) qs.set('skipTotal', 'true');
                const res = await PC.apiFetch('/api/v6/workflows/inbox?' + qs, { method: 'GET' });
                document.getElementById('emptyHint').classList.add('hidden');
                const out = document.getElementById('response');
                out.classList.remove('hidden');
                out.textContent = PC.prettyJson(res.data || res.text);
                document.getElementById('postOutputActions').classList.remove('hidden');
                if (!res.ok) { err.textContent = PC.prettyJson(res.data || res.text); err.classList.remove('hidden'); }
            } finally {
                document.getElementById('btnLabel').textContent = 'Load Inbox';
                document.getElementById('spinner').classList.add('hidden');
            }
        };
    </script>
</body>
</html>
