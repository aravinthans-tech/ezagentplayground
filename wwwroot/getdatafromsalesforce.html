<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Data From Salesforce - API Playground</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/theme.css">
    <script src="/theme.js"></script>
    <link rel="stylesheet" href="/css/playground-sidebar.css">
    <link rel="stylesheet" href="/css/playground-animations.css">
    <link rel="stylesheet" href="/css/playground-v6.css">
    <link rel="stylesheet" href="/css/playground-dark.css">
</head>
<body class="pg-app bg-gradient-to-br gradient-animate from-gray-50 via-blue-50 to-purple-50 flex flex-col" style="height: 100vh; margin: 0; padding: 0; overflow: hidden; background-size: 400% 400%; ">
    <nav class="bg-white shadow-md h-12 flex items-center justify-between px-6 flex-shrink-0 relative sticky top-0 z-40">
        <a href="/apikey.html" class="pg-brand flex items-center gap-2.5 flex-shrink-0 min-w-0 no-underline">
            <img src="/logo.png" alt="EZOFIS" class="pg-brand-logo h-8 w-auto max-w-[100px] object-contain flex-shrink-0" onerror="this.style.display='none';var f=this.nextElementSibling;if(f)f.style.display='flex';">
            <span class="pg-logo-fallback hidden items-center gap-0.5 text-base font-bold tracking-tight whitespace-nowrap" style="display:none"><span class="text-purple-600">ez</span><span class="text-purple-500">o</span><span class="text-purple-700">fis</span></span>
            <h1 class="pg-brand-title">API Playground</h1>
        </a>
        <div class="flex space-x-4 flex-1 justify-end text-sm">
            <a href="/examples.html" class="px-3 py-1 rounded text-sm font-semibold text-gray-700 hover:bg-gray-100">Code Examples</a>
            <a href="/playground-documentation.html#getdata-from-salesforce" class="px-3 py-1 rounded text-sm font-semibold text-gray-700 hover:bg-gray-100">Developer Docs</a>
            <a href="/my-api-keys.html" class="px-3 py-1 rounded text-sm font-semibold text-gray-700 hover:bg-gray-100">My API Keys</a>
            <a href="/usage-report.html" class="px-3 py-1 rounded text-sm font-semibold text-gray-700 hover:bg-gray-100">API Usage</a>
        </div>
    </nav>

    <div class="flex flex-1 overflow-hidden" style="min-height: 0;">
        <aside id="sidebar" class="sticky top-0 h-[calc(100vh-3rem)]"></aside>
        <script src="/js/playground-sidebar.js"></script>
        <script>PlaygroundSidebar.mount('/getdatafromsalesforce.html');</script>

        <main class="flex-1 overflow-y-auto p-4">
            <div class="max-w-6xl mx-auto">
                <div class="text-center mb-4 animate-fadeInUp py-1">
                    <h2 class="text-xl font-semibold text-gray-900">Get Data From Salesforce</h2>
                    <p class="text-xs text-gray-600 mt-1">Encrypt payload, call <code class="bg-gray-100 px-1 rounded">/api/file/GetDataFromSalesforce</code>, decrypt response.</p>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
                    <div class="bg-white rounded-lg shadow-md p-4 space-y-3 card-hover animate-slideInLeft delay-100">
                        <h3 class="text-base font-semibold text-gray-900">Request</h3>
                        <div><label class="block text-xs font-semibold text-gray-700 mb-1">Playground API key <span class="text-red-500">*</span></label><input id="apiKey" class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm input-focus" placeholder="X-API-Key"></div>
                        <div><label class="block text-xs font-semibold text-gray-700 mb-1">Ezofis JWT <span class="text-red-500">*</span></label><input id="ezofisToken" class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm input-focus" placeholder="Ezofis token"></div>
                        <div><label class="block text-xs font-semibold text-gray-700 mb-1">Payload JSON <span class="text-red-500">*</span></label><textarea id="payloadJson" rows="8" class="w-full border border-gray-300 rounded-md px-3 py-2 text-xs mono input-focus" spellcheck="false">{
  "searchText": "ACC001"
}</textarea></div>
                        <button id="submitBtn" class="w-full py-2 rounded-md text-white text-sm font-medium pg-btn-primary button-hover">Get Data</button>
                        <div id="errBox" class="hidden text-xs text-red-700 bg-red-50 border border-red-200 rounded-md p-2.5"></div>
                    </div>
                    <div class="bg-white rounded-lg shadow-md p-4 card-hover animate-slideInRight delay-200">
                        <h3 class="text-base font-semibold text-gray-900 mb-2">Response</h3>
                        <div class="space-y-3">
                            <div><span class="text-xs font-semibold text-gray-500">id</span><pre id="outId" class="mt-1 bg-gray-50 border rounded p-2"></pre></div>
                            <div><span class="text-xs font-semibold text-gray-500">output</span><pre id="outPlain" class="mt-1 bg-gray-50 border rounded p-2 max-h-96 overflow-auto"></pre></div>
                            <div><span class="text-xs font-semibold text-gray-500">encryptOutput</span><pre id="outEnc" class="mt-1 bg-gray-50 border rounded p-2 max-h-96 overflow-auto"></pre></div>
                        </div>
                        <div id="postOutputActions" class="hidden mt-3 flex flex-wrap gap-2 justify-end">
                            <button type="button" id="viewCodeExamplesBtn" class="text-xs px-3 py-1.5 rounded-md font-medium text-white bg-purple-600 hover:bg-purple-700 border border-purple-800/20 shadow-sm">Code examples</button>
                            <button type="button" id="viewDocumentationBtn" class="text-xs px-3 py-1.5 rounded-md font-medium text-gray-700 bg-white border border-gray-300 hover:bg-gray-50 shadow-sm">Docs</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script>
        document.querySelectorAll('.api-nav').forEach(btn => btn.addEventListener('click', () => { const url = btn.getAttribute('data-go'); if (url) window.location.href = url; }));
        const API_BASE = window.location.origin;
        const errBox = document.getElementById('errBox');
        const pretty = (v) => { try { if (typeof v === 'string') { const t=v.trim(); if ((t.startsWith('{')&&t.endsWith('}'))||(t.startsWith('[')&&t.endsWith(']'))) return JSON.stringify(JSON.parse(t), null, 2);} return typeof v === 'string' ? v : JSON.stringify(v, null, 2);} catch { return String(v ?? ''); } };
        document.getElementById('submitBtn').addEventListener('click', async () => {
            const apiKey = document.getElementById('apiKey').value.trim();
            const ezofisToken = document.getElementById('ezofisToken').value.trim();
            let payload;
            try { payload = JSON.parse(document.getElementById('payloadJson').value); } catch (e) { errBox.textContent = 'Invalid payload JSON: ' + e.message; errBox.classList.remove('hidden'); return; }
            if (!apiKey || !ezofisToken) { errBox.textContent = 'apiKey and Ezofis token required'; errBox.classList.remove('hidden'); return; }
            errBox.classList.add('hidden');
            document.getElementById('postOutputActions').classList.add('hidden');
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.textContent = 'Loading...';
            try {
                const res = await fetch(`${API_BASE}/api/GetDataFromSalesforce`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-API-Key': apiKey, 'Ezofis-Token': ezofisToken },
                    body: JSON.stringify({ payload })
                });
                const data = await res.json().catch(() => ({}));
                if (!res.ok) { errBox.textContent = data.encryptOutput || data.message || res.statusText; errBox.classList.remove('hidden'); }
                document.getElementById('outId').textContent = String(data.id ?? '');
                document.getElementById('outPlain').textContent = pretty(data.output);
                document.getElementById('outEnc').textContent = pretty(data.encryptOutput);
                if (res.ok) {
                    document.getElementById('postOutputActions').classList.remove('hidden');
                    try { localStorage.setItem('getdatafromsalesforce_data', JSON.stringify({ apiKey, ezofisToken, payloadText: document.getElementById('payloadJson').value })); } catch (_) {}
                }
            } catch (e) {
                errBox.textContent = e.message || String(e);
                errBox.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Get Data';
            }
        });
        document.getElementById('viewCodeExamplesBtn').addEventListener('click', () => { window.location.href = '/examples.html?function=getdatafromsalesforce'; });
        document.getElementById('viewDocumentationBtn').addEventListener('click', () => { window.location.href = '/playground-documentation.html#getdata-from-salesforce'; });
    </script>
    <script src="/js/playground-shell.js"></script>
</body>
</html>
