<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generate PDF - API Playground</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/theme.css">
    <script src="/theme.js"></script>
    <link rel="stylesheet" href="/css/playground-sidebar.css">
    <link rel="stylesheet" href="/css/playground-animations.css">
    <link rel="stylesheet" href="/css/playground-v6.css">
    <link rel="stylesheet" href="/css/playground-dark.css">
</head>
<body class="pg-app bg-gradient-to-br gradient-animate from-gray-50 via-blue-50 to-purple-50 flex flex-col" style="height: 100vh; margin: 0; padding: 0; overflow: hidden; background-size: 400% 400%; ">
    <nav class="bg-white shadow-md h-12 flex items-center justify-between px-6 flex-shrink-0 relative sticky top-0 z-40">
        <a href="/apikey.html" class="pg-brand flex items-center gap-2.5 flex-shrink-0 min-w-0 no-underline">
            <img src="/logo.png" alt="EZOFIS" class="pg-brand-logo h-8 w-auto max-w-[100px] object-contain flex-shrink-0" onerror="this.style.display='none';var f=this.nextElementSibling;if(f)f.style.display='flex';">
            <span class="pg-logo-fallback hidden items-center gap-0.5 text-base font-bold tracking-tight whitespace-nowrap" style="display:none"><span class="text-purple-600">ez</span><span class="text-purple-500">o</span><span class="text-purple-700">fis</span></span>
            <h1 class="pg-brand-title">API Playground</h1>
        </a>
        <div class="flex space-x-4 flex-1 justify-end text-sm">
            <a href="/examples.html" class="px-3 py-1 rounded text-sm font-semibold text-gray-700 hover:bg-gray-100">Code Examples</a>
            <a href="/playground-documentation.html#generate-pdf" class="px-3 py-1 rounded text-sm font-semibold text-gray-700 hover:bg-gray-100">Developer Docs</a>
            <a href="/my-api-keys.html" class="px-3 py-1 rounded text-sm font-semibold text-gray-700 hover:bg-gray-100">My API Keys</a>
            <a href="/usage-report.html" class="px-3 py-1 rounded text-sm font-semibold text-gray-700 hover:bg-gray-100">API Usage</a>
        </div>
    </nav>

    <div class="flex flex-1 overflow-hidden" style="min-height: 0;">
        <aside id="sidebar" class="sticky top-0 h-[calc(100vh-3rem)]"></aside>
        <script src="/js/playground-sidebar.js"></script>
        <script>PlaygroundSidebar.mount('/subformsubmitarchive.html');</script>

        <main class="flex-1 overflow-y-auto p-4">
            <div class="max-w-6xl mx-auto">
                <div class="text-center mb-4 animate-fadeInUp py-1">
                    <h2 class="text-xl font-semibold text-gray-900">Generate PDF</h2>
                    <p class="text-xs text-gray-600 mt-1">One call: form entry submit + generate PDF upload/archive.</p>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
                    <div class="bg-white rounded-lg shadow-md p-4 space-y-3 card-hover animate-slideInLeft delay-100">
                        <h3 class="text-base font-semibold text-gray-900">Request</h3>
                        <input type="text" id="apiKey" class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm input-focus" placeholder="Playground API key *">
                        <input type="text" id="ezofisToken" class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm input-focus" placeholder="Ezofis JWT *">
                        <div class="grid grid-cols-2 gap-2">
                            <input type="number" id="formId" class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm input-focus" placeholder="formId *" value="139">
                            <input type="number" id="templateId" class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm input-focus" placeholder="templateId *" value="132">
                            <input type="number" id="entryIdForFormEntry" class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm input-focus" placeholder="entryIdForFormEntry" value="0">
                            <input type="number" id="entryId" class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm input-focus" placeholder="entryId (optional)" value="0">
                        </div>
                        <input type="text" id="panelName" class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm input-focus" placeholder="panelName *" value="009 - Account Details.010 - Dealer Credit Details">
                        <label class="inline-flex items-center gap-2 text-xs"><input type="checkbox" id="isMultiple" class="rounded border-gray-300"> isMultiple</label>
                        <textarea id="fieldsJson" rows="8" class="w-full border border-gray-300 rounded-md px-3 py-2 text-xs font-mono input-focus" spellcheck="false">{
  "ed3dZq8mL_6QgGV26PAJj": "123456"
}</textarea>
                        <button type="button" id="submitBtn" class="w-full py-2 rounded-md text-white text-sm font-medium pg-btn-primary button-hover">Submit + Archive</button>
                        <div id="errBox" class="hidden text-xs text-red-700 bg-red-50 border border-red-200 rounded-md p-2.5"></div>
                    </div>
                    <div class="bg-white rounded-lg shadow-md p-4 card-hover animate-slideInRight delay-200">
                        <h3 class="text-base font-semibold text-gray-900 mb-2">Response</h3>
                        <div id="outBox" class="space-y-3">
                            <div><span class="text-xs font-semibold text-gray-500">id</span><pre id="outId" class="mt-1 bg-gray-50 border rounded p-2"></pre></div>
                            <div><span class="text-xs font-semibold text-gray-500">output</span><pre id="outPlain" class="mt-1 bg-gray-50 border rounded p-2 max-h-96 overflow-auto"></pre></div>
                            <div><span class="text-xs font-semibold text-gray-500">encryptOutput</span><pre id="outEnc" class="mt-1 bg-gray-50 border rounded p-2 max-h-96 overflow-auto"></pre></div>
                        </div>
                        <div id="postOutputActions" class="hidden mt-3 flex flex-wrap gap-2 justify-end">
                            <button type="button" id="viewCodeExamplesBtn" class="text-xs px-3 py-1.5 rounded-md font-medium text-white bg-purple-600 hover:bg-purple-700 border border-purple-800/20 shadow-sm">Code examples</button>
                            <button type="button" id="viewDocumentationBtn" class="text-xs px-3 py-1.5 rounded-md font-medium text-gray-700 bg-white border border-gray-300 hover:bg-gray-50 shadow-sm">Docs</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script>
        document.querySelectorAll('.api-nav').forEach(btn => btn.addEventListener('click', () => { const url = btn.getAttribute('data-go'); if (url) window.location.href = url; }));
        const API_BASE = window.location.origin;
        function pretty(v){ try{ if(typeof v==='string'){ const t=v.trim(); if((t.startsWith('{')&&t.endsWith('}'))||(t.startsWith('[')&&t.endsWith(']'))) return JSON.stringify(JSON.parse(t),null,2);} return typeof v==='string'?v:JSON.stringify(v,null,2);}catch{return String(v??'');}}
        document.getElementById('submitBtn').addEventListener('click', async () => {
            const btn = document.getElementById('submitBtn');
            const apiKey = document.getElementById('apiKey').value.trim();
            const ezofisToken = document.getElementById('ezofisToken').value.trim();
            const formId = parseInt(document.getElementById('formId').value, 10);
            const templateId = parseInt(document.getElementById('templateId').value, 10);
            const entryIdForFormEntry = parseInt(document.getElementById('entryIdForFormEntry').value || '0', 10);
            const entryId = parseInt(document.getElementById('entryId').value || '0', 10);
            const panelName = document.getElementById('panelName').value.trim();
            const isMultiple = document.getElementById('isMultiple').checked;
            let fields;
            try { fields = JSON.parse(document.getElementById('fieldsJson').value); } catch (e) { document.getElementById('errBox').textContent = 'Invalid fields JSON: ' + e.message; document.getElementById('errBox').classList.remove('hidden'); document.getElementById('postOutputActions').classList.add('hidden'); return; }
            if (!apiKey || !ezofisToken || !formId || !templateId || !panelName) { document.getElementById('errBox').textContent = 'apiKey, ezofisToken, formId, templateId, panelName required'; document.getElementById('errBox').classList.remove('hidden'); document.getElementById('postOutputActions').classList.add('hidden'); return; }
            document.getElementById('errBox').classList.add('hidden');
            document.getElementById('postOutputActions').classList.add('hidden');
            btn.disabled = true;
            btn.textContent = 'Submitting...';
            try {
                const res = await fetch(`${API_BASE}/api/SubFormSubmitAndArchive`, {
                    method: 'POST',
                    headers: { 'Content-Type':'application/json', 'X-API-Key': apiKey, 'Ezofis-Token': ezofisToken },
                    body: JSON.stringify({ formId, templateId, entryIdForFormEntry, entryId, isMultiple, panelName, fields })
                });
                const data = await res.json().catch(()=>({}));
                if (!res.ok) {
                    document.getElementById('errBox').textContent = data.encryptOutput || data.message || res.statusText || 'Request failed';
                    document.getElementById('errBox').classList.remove('hidden');
                }
                document.getElementById('outId').textContent = String(data.id ?? '');
                document.getElementById('outPlain').textContent = pretty(data.output);
                document.getElementById('outEnc').textContent = pretty(data.encryptOutput);
                localStorage.setItem('subformsubmitarchive_data', JSON.stringify({ apiKey, ezofisToken, formId, templateId, entryIdForFormEntry, entryId, panelName, isMultiple, fieldsText: document.getElementById('fieldsJson').value }));
                if (res.ok) document.getElementById('postOutputActions').classList.remove('hidden');
            } catch (e) {
                document.getElementById('errBox').textContent = e.message || String(e);
                document.getElementById('errBox').classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Submit + Archive';
            }
        });
        window.addEventListener('load', () => { try {
            if (window.PlaygroundFormStorage) {
                window.PlaygroundFormStorage.clearOnReload(['subformsubmitarchive_data']);
                if (!window.PlaygroundFormStorage.shouldRestore()) return;
            }
            const s=JSON.parse(localStorage.getItem('subformsubmitarchive_data')||'null'); if(!s) return; ['apiKey','ezofisToken','panelName'].forEach(k=>{ if(s[k]) document.getElementById(k).value=s[k];}); ['formId','templateId','entryIdForFormEntry','entryId'].forEach(k=>{ if(s[k]!==undefined) document.getElementById(k).value=s[k];}); if(s.isMultiple) document.getElementById('isMultiple').checked=true; if(s.fieldsText) document.getElementById('fieldsJson').value=s.fieldsText; } catch(_){} });
        document.getElementById('viewCodeExamplesBtn').addEventListener('click', () => { window.location.href = '/examples.html?function=generatepdf'; });
        document.getElementById('viewDocumentationBtn').addEventListener('click', () => { window.location.href = '/playground-documentation.html#generate-pdf'; });
    </script>
    <script src="/js/playground-shell.js"></script>
</body>
</html>
